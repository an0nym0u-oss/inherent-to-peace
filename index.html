<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Beast Is Coming</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: black;
    height: 100vh;
    font-family: "Courier New", monospace;
    animation: pulse 2s infinite alternate;
}

@keyframes pulse {
    from {
        background: #100000;
    }
    to {
        background: #700000;
    }
}

#screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

.text {
    position: absolute;
    color: #ff0000;
    font-weight: bold;
    text-shadow:
        0 0 5px red,
        0 0 15px red,
        0 0 30px darkred;

    animation:
        move 5s linear infinite,
        glitch 0.15s infinite;
}

@keyframes move {
    from {
        transform: translateY(110vh) rotate(0deg);
    }

    to {
        transform: translateY(-20vh) rotate(360deg);
    }
}

@keyframes glitch {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

.flash {
    position: fixed;
    inset: 0;
    background: red;
    opacity: 0;
    animation: flash 3s infinite;
}

@keyframes flash {
    0%,80% {
        opacity:0;
    }
    85% {
        opacity:0.3;
    }
    100% {
        opacity:0;
    }
}
</style>
</head>

<body>

<div id="screen"></div>
<div class="flash"></div>

<script>

const phrases = [

"The Beast is Coming",
"The Devil is Here",
"Mariane is the Culprit",
"Shinui lies in his Golden Eyes",
"The Apocalypse is Eternal",
"The Red Moon is Watching",
"There is No Salvation",
"The Beast Has Awakened",
"Everything Was A Lie",
"Your Fate Was Written",
"The End Has Already Begun",
"Do Not Trust The Golden Eyes",
"Mariane Knows The Truth",
"Shinui Never Told The Truth",
"The Devil Smiles Below",
"The World Will Burn Again",
"The Cycle Never Ends",
"The Last Day Is Here",
"Four Nights. Four Days. Eternal Blood.",
"The Door Is Open",
"Something Is Coming",
"You Cannot Escape",
"The Beast Remembers",
"The Apocalypse Breathes",
"All Secrets Will Be Revealed",
"Death Is Only The Beginning",
"The Sky Will Turn Red",
"Repent Before The End",
"He Is Already Here"

];


function createText(){

    let text = document.createElement("div");

    text.className = "text";

    text.innerHTML =
    phrases[Math.floor(Math.random()*phrases.length)];


    text.style.left =
    Math.random()*100 + "vw";

    text.style.fontSize =
    (15 + Math.random()*50) + "px";


    text.style.animationDuration =
    (3 + Math.random()*8) + "s";


    text.style.color =
    Math.random() > 0.5
    ? "#ff0000"
    : "#990000";


    document.getElementById("screen")
    .appendChild(text);


    setTimeout(()=>{
        text.remove();
    },10000);

}


setInterval(createText,150);


</script>

</body>
</html>
